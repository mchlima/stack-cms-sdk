name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  # CS-01: todo dia, confere se a API publicada mudou o contrato sem o SDK acompanhar.
  schedule:
    - cron: '23 9 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tipos, testes, build e contrato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatação
        run: pnpm format:check

      - name: Tipos gerados em dia com openapi/delivery.json
        run: |
          pnpm generate
          git diff --exit-code src/generated/

      - name: Tipos
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Contrato igual ao da API publicada (CS-01)
        run: pnpm openapi:check
